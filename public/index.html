<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The VryfiExchange — Join The Exchange</title>
  <link rel="icon" type="image/png" href="https://www.vryfiexchange.com/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fffaf1;
      --panel: #ffffff;
      --border: rgba(0,0,0,.08);
      --text: #171717;
      --muted: rgba(23,23,23,.62);
      --soft: rgba(23,23,23,.45);
      --coral: #ff6b4a;
      --coral-soft: rgba(255,107,74,.12);
      --mint: #0fa58a;
      --mint-soft: rgba(15,165,138,.12);
      --gold: #f0c040;
      --gold-soft: rgba(240,192,64,.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Glow background */
    .glow {
      pointer-events: none;
      position: fixed;
      inset: 0;
      height: 100vh;
      background:
        radial-gradient(circle at 12% 12%, rgba(255,123,88,.18), transparent 24%),
        radial-gradient(circle at 88% 8%, rgba(39,201,176,.18), transparent 22%),
        radial-gradient(circle at 50% 30%, rgba(255,214,92,.16), transparent 28%);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 8px;
    }
    .brand-name {
      font-size: 13px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--soft);
      font-weight: 500;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,.85);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,.06);
      padding: 44px 40px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--mint);
      font-weight: 600;
      text-align: center;
      margin: 0 0 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      line-height: 1.08;
      letter-spacing: -.04em;
      font-weight: 700;
      text-align: center;
    }
    h1 .accent {
      color: var(--coral);
    }

    .subtitle {
      text-align: center;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
      margin: 0 0 32px;
    }

    /* Form */
    .form-group {
      margin-bottom: 22px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--text);
      margin-bottom: 8px;
    }

    /* Toggle buttons for renting question */
    .toggle-group {
      display: flex;
      gap: 8px;
    }
    .toggle-group input[type="radio"] {
      display: none;
    }
    .toggle-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s ease;
      font-family: 'Inter', sans-serif;
    }
    .toggle-btn:hover {
      border-color: rgba(0,0,0,.18);
      color: var(--text);
    }
    input[type="radio"]#rent-yes:checked ~ label[for="rent-yes"],
    input[type="radio"]#rent-soon:checked ~ label[for="rent-soon"],
    input[type="radio"]#rent-no:checked ~ label[for="rent-no"] {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
      box-shadow: 0 8px 18px rgba(0,0,0,.18);
    }

    /* Text input */
    .text-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .text-input::placeholder {
      color: var(--soft);
    }
    .text-input:focus {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px var(--mint-soft);
    }

    /* Email input */
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row .text-input {
      flex: 1;
    }

    /* Submit button */
    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 28px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15px;
      background: var(--text);
      color: #fff;
      border: 0;
      box-shadow: 0 14px 30px rgba(0,0,0,.12);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: transform .15s ease, box-shadow .15s ease;
      white-space: nowrap;
    }
    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(0,0,0,.18);
    }
    .submit-btn:active {
      transform: translateY(0);
    }

    /* Full-width submit */
    .submit-full {
      width: 100%;
      margin-top: 28px;
      min-height: 54px;
      font-size: 16px;
      border-radius: 16px;
    }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    /* Status pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--mint-soft);
      color: var(--mint);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--mint);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(15,165,138,.5); }
      70% { box-shadow: 0 0 0 8px rgba(15,165,138,0); }
      100% { box-shadow: 0 0 0 0 rgba(15,165,138,0); }
    }

    /* Success state */
    .success-msg {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    .success-msg .check-circle {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: var(--mint-soft);
      color: var(--mint);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }
    .success-msg h2 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      letter-spacing: -.03em;
    }
    .success-msg p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin: 0;
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--soft);
    }
    .footer a {
      color: var(--mint);
      text-decoration: none;
      font-weight: 500;
    }

    @media (max-width: 500px) {
      .card { padding: 32px 24px; border-radius: 24px; }
      .toggle-group { flex-direction: column; gap: 6px; }
      .input-row { flex-direction: column; }
      .submit-btn { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <div class="page">

    <div class="brand">
      <span class="brand-name">The VryfiExchange</span>
    </div>

    <div class="card" id="formCard">

      <div style="text-align:center;">
        <span class="status-pill">
          <span class="status-dot"></span>
          25,000 units live
        </span>
      </div>

      <p class="eyebrow">Join The Exchange</p>
      <h1>Let the perfect home <span class="accent">find you.</span></h1>
      <p class="subtitle">Answer two quick questions and we'll match you with apartments in NYC.</p>

      <form id="exchangeForm" action="https://formspree.io/f/mvznvorn" method="POST">

        <!-- Q1: Renting? -->
        <div class="form-group">
          <label class="form-label">Are you looking to rent?</label>
          <div class="toggle-group">
            <input type="radio" id="rent-yes" name="renting" value="Yes" required>
            <input type="radio" id="rent-soon" name="renting" value="In a Little">
            <input type="radio" id="rent-no" name="renting" value="No">
            <label class="toggle-btn" for="rent-yes">Yes</label>
            <label class="toggle-btn" for="rent-soon">In a Little</label>
            <label class="toggle-btn" for="rent-no">No</label>
          </div>
        </div>

        <!-- Q2: Neighborhood -->
        <div class="form-group">
          <label class="form-label" for="neighborhood">What neighborhood in NYC are you looking to rent in?</label>
          <input type="text" id="neighborhood" name="neighborhood" class="text-input" placeholder="e.g. East Village, Williamsburg, UWS..." required>
        </div>

        <hr class="divider">

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Your email</label>
          <input type="email" id="email" name="email" class="text-input" placeholder="you@email.com" required>
        </div>

        <!-- Hidden: source -->
        <input type="hidden" name="_subject" value="New Exchange Signup">
        <input type="hidden" name="_source" value="email-campaign">

        <button type="submit" class="submit-btn submit-full">
          Get Matched &rarr;
        </button>

      </form>

      <!-- Success message (shown after submit) -->
      <div class="success-msg" id="successMsg">
        <div class="check-circle">&#10003;</div>
        <h2>You're in.</h2>
        <p>We'll match you with apartments in your neighborhood and reach out soon.</p>
      </div>

    </div>

    <div class="footer">
      &copy; 2026 VryfID &mdash; <a href="https://www.vryfiexchange.com/">The VryfiExchange</a>
    </div>

  </div>

  <script>
    // Pre-fill renting choice from URL param
    const params = new URLSearchParams(window.location.search);
    const renting = params.get('renting');
    if (renting) {
      const map = { 'yes': 'rent-yes', 'in a little': 'rent-soon', 'no': 'rent-no' };
      const id = map[renting.toLowerCase()];
      if (id) document.getElementById(id).checked = true;
    }

    // Handle form submission via fetch
    document.getElementById('exchangeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('.submit-btn');
      btn.textContent = 'Submitting...';
      btn.disabled = true;

      try {
        const resp = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (resp.ok) {
          form.style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          btn.textContent = 'Something went wrong — try again';
          btn.disabled = false;
        }
      } catch {
        btn.textContent = 'Something went wrong — try again';
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
