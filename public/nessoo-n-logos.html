<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nessoo — N Logo Concepts</title>
  <style>
    :root {
      --deep: #143127;
      --sage: #CFE0C4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080e0b;
      font-family: -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 40px;
      padding: 80px 40px 140px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      aspect-ratio: 1;
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      gap: 28px;
    }
    .card .num {
      position: absolute;
      top: 24px;
      left: 28px;
      font-size: 10px;
      letter-spacing: 3px;
      font-family: 'Courier New', monospace;
      opacity: 0.2;
    }
    .card .tag {
      position: absolute;
      bottom: 24px;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      opacity: 0.22;
    }
    .dark { background: var(--deep); color: var(--sage); }
    .light { background: #f2f5ef; color: var(--deep); }
    .black { background: #080e0b; color: var(--sage); border: 1px solid rgba(207,224,196,0.04); }

    .header {
      text-align: center;
      padding: 80px 20px 0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(207,224,196,0.2);
    }

    /* ═══════════════════════════════════════
       1. LINKED N
       The diagonal stroke of the N is replaced
       with two interlocking chain links —
       connection is literally built into the letter.
    ═══════════════════════════════════════ */
    .c1 svg { width: 180px; height: 220px; }

    /* ═══════════════════════════════════════
       2. CONTINUOUS LOOP N
       The N is drawn as one continuous line that
       loops at the base, never breaking — an
       unbroken connection.
    ═══════════════════════════════════════ */
    .c2 svg { width: 180px; height: 220px; }

    /* ═══════════════════════════════════════
       3. BRIDGE N
       The diagonal of the N becomes a suspension
       bridge cable — the N itself IS a bridge
       connecting two pillars.
    ═══════════════════════════════════════ */
    .c3 svg { width: 200px; height: 220px; }

    /* ═══════════════════════════════════════
       4. NEGATIVE SPACE ARROW
       The diagonal creates a forward-pointing
       arrow in the negative space — connection
       with momentum.
    ═══════════════════════════════════════ */
    .c4 svg { width: 190px; height: 220px; }

    /* ═══════════════════════════════════════
       5. WOVEN N
       The vertical strokes and diagonal weave
       over/under each other like threads.
    ═══════════════════════════════════════ */
    .c5 svg { width: 180px; height: 220px; }

    /* ═══════════════════════════════════════
       6. CIRCUIT N
       The N rendered as a circuit path with
       rounded corners and node dots — digital
       connection.
    ═══════════════════════════════════════ */
    .c6 svg { width: 180px; height: 220px; }

    /* ═══════════════════════════════════════
       7. SPLIT N
       The diagonal is split with a gap that
       almost connects — tension, magnetism,
       the moment before link.
    ═══════════════════════════════════════ */
    .c7 svg { width: 180px; height: 220px; }

    /* ═══════════════════════════════════════
       8. LEAF / ORGANIC N
       The diagonal curves into an organic leaf
       shape — natural growth, living connections.
    ═══════════════════════════════════════ */
    .c8 svg { width: 180px; height: 230px; }

    /* ═══════════════════════════════════════
       9. MONOLINE ROUND N
       Perfectly uniform stroke width, generous
       rounded corners — modern, approachable,
       premium SaaS feel.
    ═══════════════════════════════════════ */
    .c9 svg { width: 170px; height: 210px; }

    /* ═══════════════════════════════════════
       10. STACKED LAYERS N
       Three Ns layered with offset — depth,
       dimension, multiple connections.
    ═══════════════════════════════════════ */
    .c10 svg { width: 200px; height: 230px; }

    /* ═══════════════════════════════════════
       11. INFINITY DIAGONAL
       The diagonal stroke loops into a small
       infinity/figure-8 — infinite connection
       embedded in the letterform.
    ═══════════════════════════════════════ */
    .c11 svg { width: 190px; height: 220px; }

    /* ═══════════════════════════════════════
       12. BOLD BLOCK N with notch
       Heavy geometric N with a notch/cut where
       the diagonal meets a vertical — a subtle
       mark of distinction, like a hallmark.
    ═══════════════════════════════════════ */
    .c12 svg { width: 180px; height: 220px; }

    /* Animated draw-in for select logos */
    .draw {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: drawIn 2s ease forwards;
    }
    @keyframes drawIn {
      to { stroke-dashoffset: 0; }
    }
    .draw-slow {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawSlow 3s ease forwards;
    }
    @keyframes drawSlow {
      to { stroke-dashoffset: 0; }
    }

    /* Pulse for the gap in #7 */
    @keyframes pulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

<div class="header">N Mark Exploration</div>

<div class="gallery">

  <!-- 1. LINKED N — diagonal is chain links -->
  <div class="card dark c1">
    <svg viewBox="0 0 180 220" fill="none">
      <!-- Left vertical -->
      <rect x="20" y="10" width="22" height="200" rx="4" fill="var(--sage)"/>
      <!-- Right vertical -->
      <rect x="138" y="10" width="22" height="200" rx="4" fill="var(--sage)"/>
      <!-- Diagonal as two interlocking links -->
      <!-- Link 1 (upper-left) -->
      <rect x="38" y="42" width="56" height="36" rx="18" ry="18"
        stroke="var(--sage)" stroke-width="10" fill="none"
        transform="rotate(-52 66 60)"/>
      <!-- Link 2 (lower-right) — interlocked -->
      <rect x="86" y="110" width="56" height="36" rx="18" ry="18"
        stroke="var(--sage)" stroke-width="10" fill="none"
        transform="rotate(-52 114 128)"/>
      <!-- Overlap mask: link1 passes OVER link2 at intersection -->
      <rect x="76" y="82" width="26" height="20" fill="var(--deep)" transform="rotate(-52 89 92)"/>
      <!-- Redraw front segment of link 1 -->
      <path d="M60 72 Q70 80 78 88" stroke="var(--sage)" stroke-width="10" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="num">01</div>
    <div class="tag">Chain-linked diagonal</div>
  </div>

  <!-- 2. CONTINUOUS LOOP N -->
  <div class="card light c2">
    <svg viewBox="0 0 180 220" fill="none">
      <path class="draw-slow" d="
        M36 210
        L36 30
        Q36 14 48 14
        Q58 14 62 28
        L128 178
        Q132 192 142 192
        Q156 192 156 176
        L156 14
      " stroke="var(--deep)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Loop at bottom connecting the two verticals -->
      <path class="draw-slow" d="
        M156 14
        L156 190
        Q156 212 136 212
        L56 212
        Q36 212 36 192
      " stroke="var(--deep)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.2"
      style="animation-delay: 1.5s"/>
    </svg>
    <div class="num">02</div>
    <div class="tag">Continuous loop</div>
  </div>

  <!-- 3. BRIDGE N -->
  <div class="card dark c3">
    <svg viewBox="0 0 200 220" fill="none">
      <!-- Left pillar -->
      <rect x="24" y="40" width="18" height="170" rx="2" fill="var(--sage)"/>
      <!-- Right pillar -->
      <rect x="158" y="40" width="18" height="170" rx="2" fill="var(--sage)"/>
      <!-- Bridge deck (main diagonal) -->
      <line x1="24" y1="80" x2="176" y2="80" stroke="var(--sage)" stroke-width="6"/>
      <!-- Suspension cables from top of pillars to deck -->
      <line x1="33" y1="40" x2="52" y2="80" stroke="var(--sage)" stroke-width="2" opacity="0.5"/>
      <line x1="33" y1="40" x2="75" y2="80" stroke="var(--sage)" stroke-width="2" opacity="0.5"/>
      <line x1="33" y1="40" x2="100" y2="80" stroke="var(--sage)" stroke-width="2" opacity="0.4"/>
      <line x1="167" y1="40" x2="148" y2="80" stroke="var(--sage)" stroke-width="2" opacity="0.5"/>
      <line x1="167" y1="40" x2="125" y2="80" stroke="var(--sage)" stroke-width="2" opacity="0.5"/>
      <line x1="167" y1="40" x2="100" y2="80" stroke="var(--sage)" stroke-width="2" opacity="0.4"/>
      <!-- Tower tops -->
      <rect x="27" y="30" width="12" height="14" rx="2" fill="var(--sage)"/>
      <rect x="161" y="30" width="12" height="14" rx="2" fill="var(--sage)"/>
      <!-- Ground line -->
      <line x1="10" y1="210" x2="190" y2="210" stroke="var(--sage)" stroke-width="2" opacity="0.15"/>
    </svg>
    <div class="num">03</div>
    <div class="tag">Suspension bridge</div>
  </div>

  <!-- 4. NEGATIVE SPACE ARROW -->
  <div class="card black c4">
    <svg viewBox="0 0 190 220" fill="none">
      <defs>
        <clipPath id="arrowClip">
          <!-- Cut out a chevron/arrow shape from the diagonal area -->
          <polygon points="75,90 95,110 75,130"/>
        </clipPath>
      </defs>
      <!-- Solid N shape -->
      <path d="
        M26 210 L26 10 L52 10 L154 170 L154 10 L180 10 L180 210 L154 210 L52 50 L52 210 Z
      " fill="var(--sage)"/>
      <!-- Arrow cutout in negative space -->
      <polygon points="82,85 110,110 82,135" fill="#080e0b"/>
      <!-- Second smaller arrow for depth -->
      <polygon points="96,95 114,110 96,125" fill="#080e0b" opacity="0.5"/>
    </svg>
    <div class="num">04</div>
    <div class="tag">Negative space arrow</div>
  </div>

  <!-- 5. WOVEN N -->
  <div class="card light c5">
    <svg viewBox="0 0 180 220" fill="none">
      <!-- Diagonal (back layer at crossings) -->
      <line x1="38" y1="198" x2="148" y2="22" stroke="var(--deep)" stroke-width="18" stroke-linecap="round"/>
      <!-- Left vertical — goes OVER diagonal at bottom -->
      <line x1="38" y1="22" x2="38" y2="198" stroke="var(--deep)" stroke-width="18" stroke-linecap="round"/>
      <!-- Cover piece: make left vert go BEHIND diagonal at top -->
      <line x1="38" y1="22" x2="38" y2="70" stroke="#f2f5ef" stroke-width="20"/>
      <line x1="38" y1="22" x2="38" y2="60" stroke="var(--deep)" stroke-width="18" stroke-linecap="round"/>
      <!-- Diagonal re-drawn at top over left vert -->
      <line x1="38" y1="62" x2="65" y2="22" stroke="var(--deep)" stroke-width="18" stroke-linecap="round"/>

      <!-- Right vertical — goes OVER diagonal at top -->
      <line x1="148" y1="22" x2="148" y2="198" stroke="var(--deep)" stroke-width="18" stroke-linecap="round"/>
      <!-- Cover piece: make right vert go BEHIND diagonal at bottom -->
      <line x1="148" y1="150" x2="148" y2="198" stroke="#f2f5ef" stroke-width="20"/>
      <line x1="148" y1="160" x2="148" y2="198" stroke="var(--deep)" stroke-width="18" stroke-linecap="round"/>
      <!-- Diagonal re-drawn at bottom over right vert -->
      <line x1="120" y1="198" x2="148" y2="148" stroke="var(--deep)" stroke-width="18" stroke-linecap="round"/>
    </svg>
    <div class="num">05</div>
    <div class="tag">Woven over-under</div>
  </div>

  <!-- 6. CIRCUIT N -->
  <div class="card dark c6">
    <svg viewBox="0 0 180 220" fill="none">
      <!-- Circuit path N with rounded corners -->
      <path d="
        M38 200
        L38 24
        Q38 16 46 16
        L56 16
        Q64 12 68 20
        L124 168
        Q128 176 136 176
        L142 176
        Q150 176 150 168
        L150 20
      " stroke="var(--sage)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Circuit nodes -->
      <circle cx="38" cy="200" r="8" fill="var(--deep)" stroke="var(--sage)" stroke-width="3"/>
      <circle cx="38" cy="200" r="3" fill="var(--sage)"/>
      <circle cx="150" cy="20" r="8" fill="var(--deep)" stroke="var(--sage)" stroke-width="3"/>
      <circle cx="150" cy="20" r="3" fill="var(--sage)"/>
      <!-- Trace nodes along path -->
      <circle cx="38" cy="110" r="3" fill="var(--sage)" opacity="0.3"/>
      <circle cx="96" cy="100" r="3" fill="var(--sage)" opacity="0.3"/>
      <circle cx="150" cy="110" r="3" fill="var(--sage)" opacity="0.3"/>
      <!-- Animated pulse along circuit -->
      <circle r="4" fill="var(--sage)" opacity="0.8">
        <animateMotion dur="3s" repeatCount="indefinite"
          path="M38 200 L38 24 Q38 16 46 16 L56 16 Q64 12 68 20 L124 168 Q128 176 136 176 L142 176 Q150 176 150 168 L150 20"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
    </svg>
    <div class="num">06</div>
    <div class="tag">Circuit trace</div>
  </div>

  <!-- 7. SPLIT / MAGNETIC GAP N -->
  <div class="card black c7">
    <svg viewBox="0 0 180 220" fill="none">
      <!-- Left vertical -->
      <rect x="26" y="14" width="20" height="192" rx="3" fill="var(--sage)"/>
      <!-- Right vertical -->
      <rect x="140" y="14" width="20" height="192" rx="3" fill="var(--sage)"/>
      <!-- Diagonal — split in the middle with magnetic gap -->
      <!-- Upper half -->
      <line x1="46" y1="14" x2="88" y2="96" stroke="var(--sage)" stroke-width="20" stroke-linecap="round"/>
      <!-- Lower half -->
      <line x1="98" y1="118" x2="140" y2="206" stroke="var(--sage)" stroke-width="20" stroke-linecap="round"/>
      <!-- Magnetic field in the gap -->
      <line x1="88" y1="100" x2="98" y2="114" stroke="var(--sage)" stroke-width="2" opacity="0.35" stroke-dasharray="2 3"/>
      <!-- Energy particles in gap -->
      <circle cx="91" cy="104" r="2" fill="var(--sage)" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="95" cy="110" r="1.5" fill="var(--sage)" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="1.8s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
      <circle cx="93" cy="107" r="2.5" fill="var(--sage)" opacity="0.5">
        <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
      <!-- Glow -->
      <circle cx="93" cy="107" r="12" fill="var(--sage)" opacity="0.06">
        <animate attributeName="opacity" values="0.03;0.1;0.03" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
      </circle>
    </svg>
    <div class="num">07</div>
    <div class="tag">Magnetic gap</div>
  </div>

  <!-- 8. LEAF / ORGANIC N -->
  <div class="card light c8">
    <svg viewBox="0 0 180 230" fill="none">
      <!-- Left vertical (stem) -->
      <line x1="38" y1="20" x2="38" y2="210" stroke="var(--deep)" stroke-width="12" stroke-linecap="round"/>
      <!-- Right vertical (stem) -->
      <line x1="148" y1="20" x2="148" y2="210" stroke="var(--deep)" stroke-width="12" stroke-linecap="round"/>
      <!-- Diagonal as organic curved leaf shape -->
      <path d="
        M42 30
        Q60 30 93 100
        Q110 140 130 170
        Q145 198 148 200
      " stroke="var(--deep)" stroke-width="12" stroke-linecap="round" fill="none"/>
      <!-- Leaf shape growing from diagonal -->
      <path d="
        M75 70
        Q95 50 115 70
        Q130 90 115 115
        Q95 90 75 70 Z
      " fill="var(--deep)" opacity="0.12"/>
      <!-- Leaf vein -->
      <path d="M80 75 Q95 85 110 105" stroke="var(--deep)" stroke-width="1.5" fill="none" opacity="0.2"/>
      <!-- Small leaf accent -->
      <path d="
        M108 140
        Q120 128 132 140
        Q140 155 128 162
        Q118 148 108 140 Z
      " fill="var(--deep)" opacity="0.08"/>
    </svg>
    <div class="num">08</div>
    <div class="tag">Organic leaf growth</div>
  </div>

  <!-- 9. MONOLINE ROUND N -->
  <div class="card dark c9">
    <svg viewBox="0 0 170 210" fill="none">
      <path class="draw" d="
        M36 196
        L36 36
        Q36 16 50 16
        Q62 16 66 32
        L116 164
        Q120 180 132 180
        Q146 180 146 164
        L146 14
      " stroke="var(--sage)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div class="num">09</div>
    <div class="tag">Monoline rounded</div>
  </div>

  <!-- 10. STACKED LAYERS N -->
  <div class="card black c10">
    <svg viewBox="0 0 200 230" fill="none">
      <!-- Back layer -->
      <path d="M46 210 L46 20 L72 20 L162 180 L162 20 L182 20 L182 210 L158 210 L66 50 L66 210 Z"
        fill="var(--sage)" opacity="0.08" transform="translate(6, 6)"/>
      <!-- Mid layer -->
      <path d="M46 210 L46 20 L72 20 L162 180 L162 20 L182 20 L182 210 L158 210 L66 50 L66 210 Z"
        fill="var(--sage)" opacity="0.18" transform="translate(3, 3)"/>
      <!-- Front layer -->
      <path d="M46 210 L46 20 L72 20 L162 180 L162 20 L182 20 L182 210 L158 210 L66 50 L66 210 Z"
        fill="var(--sage)" opacity="1"/>
    </svg>
    <div class="num">10</div>
    <div class="tag">Stacked depth</div>
  </div>

  <!-- 11. INFINITY DIAGONAL -->
  <div class="card light c11">
    <svg viewBox="0 0 190 220" fill="none">
      <!-- Left vertical -->
      <rect x="24" y="10" width="20" height="200" rx="3" fill="var(--deep)"/>
      <!-- Right vertical -->
      <rect x="148" y="10" width="20" height="200" rx="3" fill="var(--deep)"/>
      <!-- Upper diagonal segment -->
      <line x1="44" y1="10" x2="78" y2="72" stroke="var(--deep)" stroke-width="20" stroke-linecap="round"/>
      <!-- Infinity loop in the middle of the diagonal -->
      <path d="
        M78 80
        Q78 60 93 60
        Q108 60 108 80
        Q108 100 93 100
        Q78 100 78 80 Z
        M108 80
        Q108 100 120 100
        Q132 100 132 80
        Q132 60 120 60
        Q108 60 108 80 Z
      " stroke="var(--deep)" stroke-width="5" fill="none" stroke-linejoin="round"/>
      <!-- Lower diagonal segment -->
      <line x1="132" y1="140" x2="168" y2="210" stroke="var(--deep)" stroke-width="20" stroke-linecap="round"/>
    </svg>
    <div class="num">11</div>
    <div class="tag">Infinity embedded</div>
  </div>

  <!-- 12. BOLD BLOCK N with distinctive notch -->
  <div class="card dark c12">
    <svg viewBox="0 0 180 220" fill="none">
      <!-- Main N shape -->
      <path d="
        M22 210
        L22 10
        L52 10
        L148 170
        L148 10
        L170 10
        L170 210
        L140 210
        L44 50
        L44 210
        Z
      " fill="var(--sage)"/>
      <!-- Distinctive notch cut at bottom-right of diagonal -->
      <rect x="126" y="165" width="24" height="24" rx="12" fill="var(--deep)"/>
      <!-- Small accent notch at top-left -->
      <rect x="34" y="28" width="16" height="16" rx="8" fill="var(--deep)"/>
    </svg>
    <div class="num">12</div>
    <div class="tag">Block with hallmark notch</div>
  </div>

</div>

</body>
</html>
