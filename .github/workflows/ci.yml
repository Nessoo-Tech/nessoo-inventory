name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check, lint, build
    runs-on: ubuntu-latest

    env:
      # Deliberately unreachable. This console reads production data through a
      # column-restricted role, so a real DATABASE_URL in CI would point a
      # build at live renter records. Every data route is dynamic, so the build
      # only needs the variable to exist.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_never_connected
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20 to match THIS project's Vercel setting (nodeVersion: 20.x).
          # Deliberately different from homey-ux, which Vercel builds on 24.x:
          # CI should check the runtime each project actually deploys on, so a
          # green build means something about production rather than about a
          # version nobody runs.
          node-version: "20"
          cache: npm

      # `npm install`, not `npm ci`, and deliberately.
      #
      # npm ci requires package.json and package-lock.json to be perfectly in
      # sync, including for OPTIONAL platform variants. The lockfile is
      # generated on Windows, where npm never resolves @img/sharp-wasm32's
      # dependency on @emnapi/runtime -- that variant is not installable on
      # win32, so no top-level entry is written. On the Linux runner npm
      # validates the whole optional tree, finds it missing and refuses:
      #
      #   npm error Missing: @emnapi/runtime@1.11.3 from lock file
      #
      # sharp is a direct dependency (EXIF stripping and thumbnails), so
      # --omit=optional is not an out -- that would drop sharp's own native
      # binary too. Regenerating the lockfile from a Linux checkout is the
      # proper fix; until then npm install honours the lockfile for everything
      # in it and resolves the platform gap rather than failing. CI that runs
      # and catches real regressions beats CI that is red over a
      # cross-platform lockfile artefact.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # No test job: this repo has no test suite yet. The verify:role and
  # verify:session scripts are NOT run here on purpose -- both connect to the
  # real database to assert the admin role's column grants, so they are
  # operational checks against production, not CI checks.
